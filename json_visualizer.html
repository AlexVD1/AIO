<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Visualizer - AIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --error: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 1rem 2rem;
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.25rem;
            margin: 0;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text);
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .panel-left {
            width: 350px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            min-width: 250px;
            background: var(--bg);
            z-index: 10;
        }

        .panel-right {
            flex: 1;
            position: relative;
            background-color: #0b1120;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .panel-header {
            padding: 0.75rem 1rem;
            background-color: #162032;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .actions button {
            background-color: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .actions button:hover {
            background-color: #334155;
            border-color: #475569;
        }

        #json-input {
            flex: 1;
            background-color: var(--bg);
            color: var(--text);
            border: none;
            padding: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            resize: none;
            outline: none;
        }

        #network {
            width: 100%;
            height: 100%;
            outline: none;
        }

        .error-message {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(239, 68, 68, 0.9);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .canvas-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .panel-left { width: 100%; height: 250px; flex: none; border-right: none; border-bottom: 1px solid var(--border); }
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <span style="font-size: 1.5rem;">🔗</span> JSON Node Visualizer
        </h1>
        <a href="index.html" class="back-link">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Volver
        </a>
    </header>

    <div class="container">
        <!-- Input Panel -->
        <div class="panel-left">
            <div class="panel-header">
                Entrada JSON
                <div class="actions">
                    <button id="btn-format">Formatear</button>
                </div>
            </div>
            <textarea id="json-input" placeholder='{"ejemplo": "Pega tu JSON aquí..."}'></textarea>
        </div>

        <!-- Output Panel (Canvas) -->
        <div class="panel-right">
            <div id="error-msg" class="error-message"></div>
            <div id="network"></div>
            
            <div class="canvas-controls">
                <div class="actions">
                    <button id="btn-fit">Centrar Grafo</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const jsonInput = document.getElementById('json-input');
        const errorMsg = document.getElementById('error-msg');
        const container = document.getElementById('network');
        
        let network = null;
        let currentJsonData = null;

        // Variables for graph generation
        let nodesArray = [];
        let edgesArray = [];
        let nodeIdCounter = 1;

        function initNetwork() {
            const data = {
                nodes: new vis.DataSet(nodesArray),
                edges: new vis.DataSet(edgesArray)
            };
            
            const options = {
                layout: {
                    hierarchical: {
                        direction: 'LR', // Left to Right
                        sortMethod: 'directed',
                        levelSeparation: 300,
                        nodeSpacing: 150,
                        treeSpacing: 200
                    }
                },
                nodes: {
                    shape: 'box',
                    margin: 15,
                    borderWidth: 2,
                    color: {
                        background: '#1e293b',
                        border: '#38bdf8',
                        highlight: {
                            background: '#334155',
                            border: '#7dd3fc'
                        }
                    },
                    font: {
                        color: '#f8fafc',
                        face: 'Fira Code, monospace',
                        size: 14,
                        align: 'left',
                        multi: true // Permite usar tags <b> <i> en el label
                    },
                    shadow: {
                        enabled: true,
                        color: 'rgba(0,0,0,0.5)',
                        size: 10,
                        x: 5,
                        y: 5
                    }
                },
                edges: {
                    color: {
                        color: '#475569',
                        highlight: '#94a3b8'
                    },
                    font: {
                        color: '#94a3b8',
                        size: 12,
                        background: '#0b1120',
                        strokeWidth: 0
                    },
                    arrows: {
                        to: { enabled: true, scaleFactor: 0.8 }
                    },
                    smooth: {
                        type: 'cubicBezier',
                        forceDirection: 'horizontal',
                        roundness: 0.4
                    }
                },
                physics: false, // Desactivado por layout jerárquico
                interaction: {
                    dragNodes: true,
                    dragView: true,
                    zoomView: true,
                    hover: true
                }
            };

            if (network !== null) {
                network.destroy();
            }
            network = new vis.Network(container, data, options);
        }

        function truncate(str, n){
            return (str.length > n) ? str.slice(0, n-1) + '...' : str;
        }

        function parseJSONToGraph(keyName, obj, parentId = null) {
            const currentId = nodeIdCounter++;
            
            let isArray = Array.isArray(obj);
            let typeTitle = isArray ? "Array" : (obj === null ? "Null" : typeof obj);
            let title = keyName ? `<b>${keyName}</b> <i>(${typeTitle})</i>` : `<b>Root</b> <i>(${typeTitle})</i>`;
            
            let labelLines = [title];
            let childObjects = [];
            
            if (typeof obj === 'object' && obj !== null) {
                // Agregar un separador visual
                if (Object.keys(obj).length > 0) {
                    labelLines.push('----------------');
                }
                
                let count = 0;
                for (const [k, v] of Object.entries(obj)) {
                    if (typeof v === 'object' && v !== null) {
                        // Es un objeto/array complejo, agendar como nodo hijo
                        childObjects.push({ key: k, val: v });
                    } else {
                        // Es primitivo, añadir al bloque del nodo actual
                        let valStr = String(v);
                        if (typeof v === 'string') {
                            valStr = `"${truncate(valStr, 30)}"`;
                        }
                        
                        let keyFormat = isArray ? `[${k}]` : k;
                        labelLines.push(`${keyFormat}: ${valStr}`);
                        count++;
                    }
                }
                if (count === 0 && childObjects.length === 0) {
                    labelLines.push("<i>(vacío)</i>");
                }
            } else {
                labelLines.push('----------------');
                let valStr = String(obj);
                if (typeof obj === 'string') valStr = `"${valStr}"`;
                labelLines.push(`Valor: ${valStr}`);
            }
            
            nodesArray.push({
                id: currentId,
                label: labelLines.join('\n')
            });
            
            if (parentId !== null) {
                edgesArray.push({
                    from: parentId,
                    to: currentId,
                    label: keyName || 'item'
                });
            }
            
            for (const child of childObjects) {
                parseJSONToGraph(child.key, child.val, currentId);
            }
        }

        function renderJson() {
            const rawValue = jsonInput.value.trim();
            
            if (!rawValue) {
                errorMsg.style.display = 'none';
                if(network) network.destroy();
                network = null;
                return;
            }

            try {
                const parsed = JSON.parse(rawValue);
                currentJsonData = parsed;
                errorMsg.style.display = 'none';
                
                // Reset graph data
                nodesArray = [];
                edgesArray = [];
                nodeIdCounter = 1;
                
                parseJSONToGraph(null, parsed, null);
                initNetwork();
                
            } catch (e) {
                errorMsg.textContent = `Error: JSON Inválido`;
                errorMsg.style.display = 'block';
            }
        }

        // Event listeners
        let debounceTimer;
        jsonInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(renderJson, 500); // Pequeño delay para no renderizar a cada tecla
        });

        document.getElementById('btn-format').addEventListener('click', () => {
            if (currentJsonData) {
                jsonInput.value = JSON.stringify(currentJsonData, null, 4);
            }
        });

        document.getElementById('btn-fit').addEventListener('click', () => {
            if (network) {
                network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
            }
        });

        // Demo inicial
        jsonInput.value = JSON.stringify({
            "proyecto": "AIO Tools",
            "version": 1.2,
            "activo": true,
            "autor": {
                "nombre": "Desarrollador",
                "rol": "Admin"
            },
            "modulos": [
                { "id": 1, "nombre": "Convertidor" },
                { "id": 2, "nombre": "Visualizador" }
            ]
        }, null, 4);
        renderJson();

    </script>
</body>
</html>
