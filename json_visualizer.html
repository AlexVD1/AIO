<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Visualizer - AIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --error: #ef4444;
            --success: #22c55e;
            
            /* Syntax highlighting */
            --json-key: #7dd3fc;
            --json-string: #86efac;
            --json-number: #fca5a5;
            --json-boolean: #c084fc;
            --json-null: #94a3b8;
            --json-punctuation: #cbd5e1;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 1rem 2rem;
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.25rem;
            margin: 0;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text);
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            min-width: 0;
        }

        .panel-header {
            padding: 0.75rem 1rem;
            background-color: #162032;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .actions button {
            background-color: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .actions button:hover {
            background-color: #334155;
            border-color: #475569;
        }

        #json-input {
            flex: 1;
            background-color: var(--bg);
            color: var(--text);
            border: none;
            padding: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            resize: none;
            outline: none;
        }

        #json-output {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            background-color: var(--bg);
        }

        .error-message {
            color: var(--error);
            font-family: 'Inter', sans-serif;
            padding: 1rem;
            border-radius: 6px;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            margin: 1rem;
            display: none;
        }

        /* Tree Styles */
        ul.json-tree {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        ul.nested {
            list-style-type: none;
            margin: 0;
            padding: 0 0 0 1.5rem;
            border-left: 1px dashed #334155;
            margin-left: 0.5rem;
        }

        li {
            margin: 0.2rem 0;
            position: relative;
        }

        .caret {
            cursor: pointer;
            user-select: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            margin-right: 4px;
            margin-left: -20px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .caret:hover {
            background-color: var(--surface);
        }

        .caret::before {
            content: "\25B6";
            color: var(--text-muted);
            font-size: 0.7rem;
            display: inline-block;
            transition: transform 0.2s ease-in-out;
        }

        .caret-down::before {
            transform: rotate(90deg);
        }

        .hidden {
            display: none !important;
        }

        /* Syntax Highlighting */
        .json-key { color: var(--json-key); }
        .json-string { color: var(--json-string); }
        .json-number { color: var(--json-number); }
        .json-boolean { color: var(--json-boolean); }
        .json-null { color: var(--json-null); font-style: italic; }
        .json-punctuation { color: var(--json-punctuation); }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .panel {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <span style="font-size: 1.5rem;">🌳</span> JSON Visualizer
        </h1>
        <a href="index.html" class="back-link">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Volver a Herramientas
        </a>
    </header>

    <div class="container">
        <!-- Input Panel -->
        <div class="panel">
            <div class="panel-header">
                Entrada JSON (Raw)
                <div class="actions">
                    <button id="btn-format">Formatear</button>
                    <button id="btn-clear">Limpiar</button>
                </div>
            </div>
            <textarea id="json-input" placeholder="Pega tu JSON aquí..."></textarea>
        </div>

        <!-- Output Panel -->
        <div class="panel">
            <div class="panel-header">
                Visualización Estructurada
                <div class="actions">
                    <button id="btn-expand">Expandir Todo</button>
                    <button id="btn-collapse">Colapsar Todo</button>
                </div>
            </div>
            <div id="error-msg" class="error-message"></div>
            <div id="json-output">
                <div style="color: var(--text-muted); padding: 1rem;">Esperando JSON...</div>
            </div>
        </div>
    </div>

    <script>
        const jsonInput = document.getElementById('json-input');
        const jsonOutput = document.getElementById('json-output');
        const errorMsg = document.getElementById('error-msg');
        
        let currentJsonData = null;

        function escapeHtml(unsafe) {
            if (unsafe === null || unsafe === undefined) return '';
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function buildHtmlTree(key, value, isLast = true) {
            let html = '';
            const type = typeof value;
            const isArray = Array.isArray(value);
            const isObject = type === 'object' && value !== null && !isArray;
            const comma = isLast ? '' : '<span class="json-punctuation">,</span>';
            
            const keyString = key !== null ? `<span class="json-key">"${escapeHtml(key)}"</span><span class="json-punctuation">: </span>` : '';

            if (isObject || isArray) {
                const keys = Object.keys(value);
                const isEmpty = keys.length === 0;
                const openBrace = isArray ? '[' : '{';
                const closeBrace = isArray ? ']' : '}';

                if (isEmpty) {
                    html += `<li>${keyString}<span class="json-punctuation">${openBrace}${closeBrace}</span>${comma}</li>`;
                } else {
                    html += `<li>
                        <span class="caret caret-down"></span>
                        ${keyString}<span class="json-punctuation">${openBrace}</span>
                        <ul class="nested">`;
                    
                    keys.forEach((k, index) => {
                        const isLastItem = index === keys.length - 1;
                        html += buildHtmlTree(isArray ? null : k, value[k], isLastItem);
                    });
                    
                    html += `</ul><span class="json-punctuation">${closeBrace}</span>${comma}</li>`;
                }
            } else {
                let valString = '';
                if (type === 'string') {
                    valString = `<span class="json-string">"${escapeHtml(value)}"</span>`;
                } else if (type === 'number') {
                    valString = `<span class="json-number">${value}</span>`;
                } else if (type === 'boolean') {
                    valString = `<span class="json-boolean">${value}</span>`;
                } else if (value === null) {
                    valString = `<span class="json-null">null</span>`;
                }
                
                html += `<li>${keyString}${valString}${comma}</li>`;
            }
            
            return html;
        }

        function renderJson() {
            const rawValue = jsonInput.value.trim();
            
            if (!rawValue) {
                errorMsg.style.display = 'none';
                jsonOutput.innerHTML = '<div style="color: var(--text-muted); padding: 1rem;">Esperando JSON...</div>';
                return;
            }

            try {
                const parsed = JSON.parse(rawValue);
                currentJsonData = parsed;
                errorMsg.style.display = 'none';
                
                const treeHtml = `<ul class="json-tree">${buildHtmlTree(null, parsed, true)}</ul>`;
                jsonOutput.innerHTML = treeHtml;
                
                // Add click listeners to carets
                const carets = jsonOutput.querySelectorAll('.caret');
                carets.forEach(caret => {
                    caret.addEventListener('click', function(e) {
                        e.stopPropagation();
                        this.classList.toggle('caret-down');
                        const nestedUl = this.parentElement.querySelector('.nested');
                        if (nestedUl) {
                            nestedUl.classList.toggle('hidden');
                        }
                    });
                });
                
            } catch (e) {
                errorMsg.textContent = `Error JSON inválido: ${e.message}`;
                errorMsg.style.display = 'block';
            }
        }

        // Event listeners
        jsonInput.addEventListener('input', renderJson);

        document.getElementById('btn-format').addEventListener('click', () => {
            if (currentJsonData) {
                jsonInput.value = JSON.stringify(currentJsonData, null, 4);
            }
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            jsonInput.value = '';
            renderJson();
        });

        document.getElementById('btn-expand').addEventListener('click', () => {
            const carets = jsonOutput.querySelectorAll('.caret');
            const nestedUls = jsonOutput.querySelectorAll('.nested');
            
            carets.forEach(c => c.classList.add('caret-down'));
            nestedUls.forEach(ul => ul.classList.remove('hidden'));
        });

        document.getElementById('btn-collapse').addEventListener('click', () => {
            const carets = jsonOutput.querySelectorAll('.caret');
            const nestedUls = jsonOutput.querySelectorAll('.nested');
            
            carets.forEach(c => c.classList.remove('caret-down'));
            nestedUls.forEach(ul => ul.classList.add('hidden'));
        });
        
        // Render on load if there's text (e.g. from refresh)
        renderJson();
    </script>
</body>
</html>
