# ============================================================
# trivia-api — Podman Compose Completo (PostgreSQL + API REST)
#
# Uso:
#   podman compose up -d
#   podman compose logs -f
#   podman compose down
# ============================================================
name: trivia-api

services:

  # ----------------------------------------------------------
  # PostgreSQL 16
  # ----------------------------------------------------------
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: trivia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: triviadb
      POSTGRES_USER: ${DATABASE_USERNAME:-trivia_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-trivia_pass}
    ports:
      - "5432:5432"
    volumes:
      - trivia-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-trivia_user} -d triviadb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------
  # Backend API REST (Spring Boot 3 + Java 21)
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/trivia-api:latest
    container_name: trivia-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/triviadb
      DATABASE_USERNAME: ${DATABASE_USERNAME:-trivia_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-trivia_pass}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-3.5-flash-lite}
      STORAGE_PATH: /data/storage
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-/assets}
      API_KEY: ${API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - trivia-storage-data:/data/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

# ----------------------------------------------------------
# Volúmenes persistentes
# ----------------------------------------------------------
volumes:
  trivia-postgres-data:
    driver: local
  trivia-storage-data:
    driver: local
