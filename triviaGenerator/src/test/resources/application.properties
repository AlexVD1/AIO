# ============================================================
# Configuración de tests — sobrescribe application.yml
#
# Por qué este archivo?
#   application.yml habilita PostgreSQL y Flyway.
#   Los tests unitarios y de integración básica (HealthController, smoke test)
#   no necesitan una base de datos real para funcionar.
#
#   Este archivo desactiva la autoconfiguración de DataSource, JPA y Flyway
#   automáticamente para TODOS los tests, sin necesidad de anotaciones adicionales.
#
#   Cuando agreguemos tests de integración con BD real (Fase 15),
#   usaremos @ActiveProfiles("integration") + Testcontainers para PostgreSQL real.
#   Esos tests SÍ tendrán acceso a la BD y overridearán estas propiedades.
# ============================================================

# Deshabilitar autoconfiguración de base de datos en tests
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.flywaydb.spring.autoconfigure.FlywayAutoConfiguration

# Suprimir el banner de Spring Boot en tests (output más limpio)
spring.main.banner-mode=off

# Reducir logging en tests
logging.level.root=WARN
logging.level.com.trivia.api=INFO
