# Desactivar autoconfiguración de base de datos para pruebas unitarias y de capa web aisladas
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Desactivar banner en tests
spring.main.banner-mode=off

# Configuración dummy para testing
story.security.api-key=test-api-key
story.storage.path=./target/test-storage
story.storage.base-url=http://localhost:8081/assets
story.ai.api-key=test-ai-key
story.image.sd-api-url=http://localhost:7860
